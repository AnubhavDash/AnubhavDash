name: Disclosures badge

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disclosures-badge
  cancel-in-progress: true

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count disclosure rows
        run: |
          count=$(grep -c '^| 20[0-9][0-9]-' README.md)
          printf '{"schemaVersion":1,"label":"disclosures","message":"%s","color":"blue"}\n' "$count" > .github/badge.json
          cat .github/badge.json
      - name: Commit badge if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/badge.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update disclosures badge [skip ci]'
          git pull --rebase --autostash origin main
          git push
